name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Run all three orchestrator scenarios (regression gate)
        run: |
          rm -rf src/target-project tests/target-project scenarios/runs
          mkdir -p scenarios/runs
          npm run dev -- run greenfield --auto-approve
          npm run dev -- run brownfield --auto-approve
          npm run dev -- run ambiguous --auto-approve
